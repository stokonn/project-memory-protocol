[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory-protocol"
version = "1.0.0a1"
description = "Local-first, agent-agnostic Git development memory and recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5"]
license = "MIT"

[project.scripts]
pmp = "pmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmp = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
